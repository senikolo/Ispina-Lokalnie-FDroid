name: Publikuj repozytorium F-Droid

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdroid-repo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Ogranicz publikację do gałęzi main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Pobierz repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ github.token }}

      - name: Zainstaluj narzędzia F-Droid
        run: |
          sudo add-apt-repository ppa:fdroid/fdroidserver -y
          sudo apt-get update
          sudo apt-get install -y fdroidserver python3-pycryptodome python3-venv openssl python3-pil && /usr/bin/python3 -m venv "$RUNNER_TEMP/fdroidserver-venv" && "$RUNNER_TEMP/fdroidserver-venv/bin/pip" install "fdroidserver==2.4.5" "androguard==4.1.4"

      - name: Pobierz najnowszy APK i sprawdź jego podpis
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-latest-apk.py
      - name: Wygeneruj ikonę repozytorium z aktualnego APK
        run: python3 scripts/extract-apk-icon.py

      - name: Odtwórz stały klucz podpisujący z sekretu
        env:
          FDROID_REPO_KEY_SEED_B64: ${{ secrets.FDROID_REPO_KEYSTORE_B64 }}
        run: |
          set -eu
          if [ -z "$FDROID_REPO_KEY_SEED_B64" ]; then
            echo "Brakuje sekretu FDROID_REPO_KEYSTORE_B64." >&2
            exit 1
          fi
          /usr/bin/python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          from Cryptodome.PublicKey import RSA

          seed = base64.b64decode(os.environ["FDROID_REPO_KEY_SEED_B64"], validate=True)
          if len(seed) != 32:
              raise SystemExit("Sekret repozytorium musi kodować dokładnie 32 bajty.")

          class HmacStream:
              def __init__(self, secret):
                  self.secret = secret
                  self.counter = 0
                  self.buffer = b""

              def __call__(self, amount):
                  while len(self.buffer) < amount:
                      message = b"fdroid-repo-rsa-v1" + self.counter.to_bytes(8, "big")
                      self.buffer += hmac.new(self.secret, message, hashlib.sha256).digest()
                      self.counter += 1
                  result, self.buffer = self.buffer[:amount], self.buffer[amount:]
                  return result

          os.umask(0o077)
          key = RSA.generate(2048, randfunc=HmacStream(seed), e=65537)
          with open("fdroid-repo-key.pem", "wb") as stream:
              stream.write(key.export_key(format="PEM"))
          PY
          if [ ! -f repo-signing-cert.pem ]; then
            openssl req -new -x509 -key fdroid-repo-key.pem -out repo-signing-cert.pem \
              -days 3650 -subj "/CN=Ispina Lokalnie Repository/O=Senikolo/C=PL"
          fi
          KEYSTORE_PASSWORD="$(/usr/bin/python3 - <<'PY'
          import base64
          import hashlib
          import os
          seed = base64.b64decode(os.environ["FDROID_REPO_KEY_SEED_B64"], validate=True)
          print(hashlib.sha256(b"fdroid-repo-keystore-password-v1" + seed).hexdigest())
          PY
          )"
          KEY_PUBLIC="$(openssl pkey -in fdroid-repo-key.pem -pubout -outform DER | sha256sum | cut -d ' ' -f 1)"
          CERT_PUBLIC="$(openssl x509 -in repo-signing-cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d ' ' -f 1)"
          if [ "$KEY_PUBLIC" != "$CERT_PUBLIC" ]; then
            echo "Zapisany certyfikat repozytorium nie pasuje do sekretu klucza." >&2
            exit 1
          fi
          openssl pkcs12 -export -inkey fdroid-repo-key.pem -in repo-signing-cert.pem \
            -name fdroidrepo -out fdroid-repo-signing.p12 -passout "pass:$KEYSTORE_PASSWORD"
          keytool -importkeystore -noprompt -srckeystore fdroid-repo-signing.p12 \
            -srcstoretype PKCS12 -srcstorepass "$KEYSTORE_PASSWORD" -srcalias fdroidrepo \
            -destkeystore fdroid-repo-signing.jks -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEYSTORE_PASSWORD" \
            -destalias fdroidrepo
          chmod 600 fdroid-repo-key.pem fdroid-repo-signing.p12 fdroid-repo-signing.jks

      - name: Wygeneruj podpisany indeks F-Droid
        env:
          FDROID_REPO_KEY_SEED_B64: ${{ secrets.FDROID_REPO_KEYSTORE_B64 }}
        run: |
          set -eu
          /usr/bin/python3 - <<'PY'
          import base64
          import hashlib
          import os
          import yaml

          seed = base64.b64decode(os.environ["FDROID_REPO_KEY_SEED_B64"], validate=True)
          if len(seed) != 32:
              raise SystemExit("Sekret repozytorium musi kodować dokładnie 32 bajty.")
          password = hashlib.sha256(b"fdroid-repo-keystore-password-v1" + seed).hexdigest()
          config = {
              "repo_name": "Ispina Lokalnie",
              "repo_url": "https://senikolo.github.io/Ispina-Lokalnie-FDroid/repo",
              "repo_description": "Własne repozytorium APK aplikacji Ispina Lokalnie prowadzone przez autora.",
              "repo_icon": "icon.png",
              "repo_keyalias": "fdroidrepo",
              "keystore": "fdroid-repo-signing.jks",
              "keystorepass": password,
              "keypass": password,
              "keydname": "CN=Ispina Lokalnie Repository, O=Senikolo, C=PL",
          }
          with open("config.yml", "w", encoding="utf-8") as stream:
              yaml.safe_dump(config, stream, allow_unicode=True, sort_keys=False)
          PY
          "$RUNNER_TEMP/fdroidserver-venv/bin/fdroid" update --create-metadata

      - name: Opublikuj repozytorium przez GitHub Pages
        run: |
          set -eu
          rm -rf docs/repo
          mkdir -p docs/repo
          cp -a repo/. docs/repo/
          cp repo-signing-cert.pem docs/repo/repo-signing-cert.pem
          git add metadata/com.ispina.mldcheck.yml docs/repo repo-signing-cert.pem
          if git diff --cached --quiet; then
            echo "Repozytorium nie wymaga zmian."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publikuj aktualizację repozytorium F-Droid"
            git push origin HEAD:main
          fi
